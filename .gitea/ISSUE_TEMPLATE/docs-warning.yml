name: Create Input Library Issue
description: Submit a new issue or feature request
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Is this issue related to documentation?
      description: |
        If you have an edit to submit or remark to make regarding documentation, please contribute using the ["Edit" button](https://docs.codeberg.org/git/clone-commit-via-web/#edit) to directly modify [documentation content](https://codeberg.org/offalynne/Input/src/branch/pages). Thank you for contributing!
      options:
        - label: This issue ***is not*** related to documentation
          required: true
  - type: textarea
    attributes:
      label: Issue or Feature Request
      description: A concise description of an issue you're experiencing or feature addition you would like
    validations:
      required: true
